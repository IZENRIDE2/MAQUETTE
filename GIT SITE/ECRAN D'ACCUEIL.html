<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IzenRide — écran d'accueil</title>
<meta name="theme-color" content="#08090E">
<!--
  Ecran d'accueil au lancement de l'application IzenRide — mise en route
  d'un tableau de bord moto, en 3 s :

    0,12 s  eclair de mise sous tension
    0,16 s  la couronne se dessine, le cadran apparait
    0,26 s  auto-test : l'aiguille se jette a fond puis revient
    0,40 s  la signature se resserre, le logo s'allume puis retombe
    0,75 s  la montee 0 -> 100 en trois rapports (75 % du temps)
    3,00 s  fin — l'application s'ouvre dans la foulee

  Reproduit la geometrie, les couleurs et les courbes du composant
  apps/mobile/components/brand/v2/SpeedoSplash.tsx.
  Ce n'est pas l'application : c'est du HTML. Il vaut pour juger le dessin
  et le rythme, pas pour valider le runtime React Native.

    · clic (ou tap) n'importe ou -> rejoue
    · ?t=430 dans l'URL          -> fige l'ecran a 430 ms-->
<style>
  :root{
    --bg:#08090E; --ink-hi:#E8EBF2; --ink-mute:#8E96A8; --ink-faint:#8E97AA;
    --dim2:#2A3545; --izen:#4D6284; --izen-bright:#7a92b8;
    --neon:#4d8fff; --neon-bright:#7eb0ff;
    --silver:#AAB1BC; --silver-light:#CDD2D9; --red:#E24B4A; --steel:#2A2F38;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:#000; color:var(--ink-hi);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  #ambient{ position:fixed; inset:0; z-index:0; opacity:0; }
  /* Éclair de mise sous tension */
  #flash{ position:fixed; inset:0; z-index:5; pointer-events:none; opacity:0;
          background:radial-gradient(circle at 50% 46%,
                     rgba(200,225,255,.95) 0%, rgba(77,143,255,.5) 22%, transparent 62%); }

  .stack{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }

  .dial{ position:relative; width:300px; height:300px; }
  .dial > svg{ position:absolute; inset:0; }
  .brand{ position:absolute; left:50%; top:50%; width:250px; height:250px;
          transform:translate(-50%,-50%) scale(.86); opacity:0; }

  .needleWrap{ position:absolute; inset:0; display:flex; justify-content:center;
               will-change:transform; opacity:0; }
  .needle{ position:absolute; top:64px; width:3px; height:86px; border-radius:2px;
           background:var(--silver-light); }
  .tip{ position:absolute; top:64px; width:3px; height:26px; border-radius:2px;
        background:var(--red); }

  .readout{ display:flex; align-items:flex-end; margin-top:14px; opacity:0; }
  .speed{ font-size:60px; font-weight:700; letter-spacing:-2px; line-height:1;
          font-variant-numeric:tabular-nums; }
  .unit{ font-size:15px; font-weight:600; margin-left:6px; margin-bottom:7px; color:var(--ink-mute); }
  /* Signature : au-dessus du cadran, elle mene l'ecran. Le text-indent
     compense l'espacement que la derniere lettre traine derriere elle. */
  .word{ margin-bottom:22px; font-size:30px; font-weight:700; color:var(--ink-hi);
         letter-spacing:26px; text-indent:26px; opacity:0; }
</style>
</head>

      <stop offset="0%" stop-color="#1A1D28"/><stop offset="50%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="amb" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="rgba(74,156,232,0.16)"/>
      <stop offset="100%" stop-color="rgba(74,156,232,0)"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#depth)"/>
  <rect width="100%" height="100%" fill="url(#amb)"/>
</svg>

<script>
'use strict';

// ══ Géométrie ══ (cadran élargi à 300 pour loger la couronne et les rayons)
const CX=150, CY=150;
const R_ARC=104, R_RED=116, R_TICK=92, R_LABEL=66, R_BEZEL=132, R_RAY_IN=126, R_RAY_OUT=146;
const START=135, SWEEP=270, REDLINE_AT=0.8, TOP=100;
const ARC_LEN  = 2*Math.PI*R_ARC   * (SWEEP/360);
const BEZ_LEN  = 2*Math.PI*R_BEZEL;

// ══ Chronologie (ms) ══
const T = {
  dark:      120,          // noir
  flash:     120,          // eclair de mise sous tension
  flashPk:   190,
  flashEnd:  460,
  bezel:    [160, 620],    // la couronne se dessine
  selfIn:   [260, 480],    // auto-test : l'aiguille se jette a fond
  selfOut:  [480, 700],    //             puis revient a zero
  logo:     [420, 1050],   // le logo s'allume puis retombe en filigrane
  logoIn:    200,          // present des la premiere image
  logoPk:    760,
  word:     [400, 900],    // la signature se resserre
  run:      [750, 3000],   // la montee 0 -> 100 : les trois quarts du temps
};
const TOTAL = 3000, HOLD = 900;

// ══ Courbes ══
const outQuad   = t => 1-Math.pow(1-t,2);
const outCubic  = t => 1-Math.pow(1-t,3);
const inOutQuad = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const linear    = t => t;
const clamp01   = v => v<0?0:v>1?1:v;
/** Avancement normalisé sur un intervalle [a,b]. */
const span = (ms,a,b) => clamp01((ms-a)/(b-a));

// Paliers de la montée — identiques à SpeedoSplash.tsx
const G1=0.27, G1S=0.31, G2=0.61, G2S=0.646, G3=0.9;
const STAGES=[[G1,0.42,outQuad],[G1S,0.45,linear],[G2,0.78,outQuad],
              [G2S,0.80,linear],[G3,1.035,outQuad],[1,1.00,inOutQuad]];
function runProfile(t){           // t : 0 → 1 sur la durée de la montée
  let from=0, prev=0;
  for(const [at,to,e] of STAGES){
    if(t<=at){ const k = at>prev ? (t-prev)/(at-prev) : 1; return from+(to-from)*e(k); }
    from=to; prev=at;
  }
  return 1;
}

const polar=(r,d)=>{const a=d*Math.PI/180;return{x:CX+r*Math.cos(a),y:CY+r*Math.sin(a)};};
const arc=(r,f,t)=>{const a=polar(r,f),b=polar(r,t);
  return `M ${a.x} ${a.y} A ${r} ${r} 0 ${Math.abs(t-f)>180?1:0} 1 ${b.x} ${b.y}`;};

// ══ Cadran ══
let g = `<defs>
  <linearGradient id="arcg" x1="0" y1="300" x2="300" y2="0">
    <stop offset="0" stop-color="#4D6284"/><stop offset=".55" stop-color="#4d8fff"/>
    <stop offset="1" stop-color="#7eb0ff"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4d8fff" stop-opacity=".85"/>
    <stop offset=".6" stop-color="#4D6284" stop-opacity=".35"/>
    <stop offset="1" stop-color="#4D6284" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle id="halo" cx="150" cy="150" r="150" fill="url(#glow)" opacity="0"/>`;

// Rayons de vitesse : ils s'allument avec l'allure
g += '<g id="rays">';
for(let i=0;i<36;i++){
  const d=i*10, a=polar(R_RAY_IN,d), b=polar(R_RAY_OUT,d);
  g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#7eb0ff"
         stroke-width="1.4" stroke-linecap="round" opacity="0"/>`;
}
g += '</g>';

// Couronne : se dessine à la mise sous tension
g += `<circle id="bezel" cx="150" cy="150" r="${R_BEZEL}" fill="none" stroke="#2A3545"
       stroke-width="1.6" stroke-dasharray="${BEZ_LEN}" stroke-dashoffset="${BEZ_LEN}"
       transform="rotate(-90 150 150)"/>`;

// Piste, arc de vitesse, zone rouge
g += `<path d="${arc(R_ARC,START,START+SWEEP)}" stroke="#2A3545" stroke-width="6"
       stroke-linecap="round" fill="none" opacity="0" id="track"/>
<path id="fill" d="${arc(R_ARC,START,START+SWEEP)}" stroke="url(#arcg)" stroke-width="6"
       stroke-linecap="round" fill="none"
       stroke-dasharray="${ARC_LEN} ${ARC_LEN}" stroke-dashoffset="${ARC_LEN}"/>
<path id="red" d="${arc(R_RED,START+SWEEP*REDLINE_AT,START+SWEEP)}" stroke="#E24B4A"
       stroke-width="4" stroke-linecap="round" fill="none" opacity="0"/>`;

// Chiffres et graduations
let marks='<g id="marks" opacity="0">';
for(let v=0;v<=TOP;v+=20){ const p=polar(R_LABEL,START+SWEEP*(v/TOP));
  marks+=`<text x="${p.x}" y="${p.y+4.5}" fill="#d8dde6" font-size="13" font-weight="600"
           text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif">${v}</text>`;}
for(let v=0;v<=TOP;v+=10){ const d=START+SWEEP*(v/TOP), maj=v%20===0;
  const i=polar(R_TICK-(maj?14:8),d), o=polar(R_TICK,d);
  marks+=`<line x1="${i.x}" y1="${i.y}" x2="${o.x}" y2="${o.y}"
           stroke="${maj?'#AAB1BC':'#a8b0c0'}" stroke-width="${maj?2.4:1.2}"
           stroke-linecap="round" opacity="${maj?.9:.5}"/>`;}
marks+='</g>';
g += marks;
g += `<circle id="hub1" cx="150" cy="150" r="7" fill="#2A2F38" opacity="0"/>
      <circle id="hub2" cx="150" cy="150" r="7" fill="none" stroke="#AAB1BC"
              stroke-width="1.5" opacity="0"/>`;

document.getElementById('face').innerHTML = g;

const $ = s => document.querySelector(s);
const el = {
  ambient:$('#ambient'), flash:$('#flash'), brand:$('#brand'), needle:$('#needle'),
  fill:$('#fill'), red:$('#red'), halo:$('#halo'), bezel:$('#bezel'), track:$('#track'),
  marks:$('#marks'), hub1:$('#hub1'), hub2:$('#hub2'), rays:$('#rays'),
  readout:$('#readout'), speed:$('#speed'), word:$('#word'),
};
const rays = Array.from(el.rays.children);

/** Rend l'écran à `ms` millisecondes depuis la mise sous tension. */
function render(ms){
  // ── Fond ──
  el.ambient.style.opacity = span(ms, T.dark, T.dark+700);

  // ── Éclair de mise sous tension ──
  const fl = ms < T.flash ? 0
           : ms < T.flashPk ? span(ms,T.flash,T.flashPk)
           : 1-span(ms,T.flashPk,T.flashEnd);
  el.flash.style.opacity = Math.max(0, fl) * 0.9;

  // ── Couronne qui se dessine ──
  const bz = outCubic(span(ms, T.bezel[0], T.bezel[1]));
  el.bezel.setAttribute('stroke-dashoffset', BEZ_LEN*(1-bz));

  // ── Apparition du cadran ──
  const face = span(ms, T.bezel[0]+120, T.bezel[0]+700);
  el.track.setAttribute('opacity', face);
  el.marks.setAttribute('opacity', face);
  el.hub1.setAttribute('opacity', face);
  el.hub2.setAttribute('opacity', face);
  el.red.setAttribute('opacity', face*0.9);
  el.needle.style.opacity = span(ms, T.selfIn[0]-60, T.selfIn[0]);

  // ── Position de l'aiguille ──
  // Auto-test d'abord (elle se jette à fond puis revient), puis la montée.
  let p;
  if(ms < T.selfIn[0])       p = 0;
  else if(ms < T.selfOut[0]) p = 1.035 * outQuad(span(ms,T.selfIn[0],T.selfIn[1]));
  else if(ms < T.run[0])     p = 1.035 * (1 - inOutQuad(span(ms,T.selfOut[0],T.selfOut[1])));
  else                       p = runProfile(span(ms,T.run[0],T.run[1]));

  el.needle.style.transform = `rotate(${p*SWEEP - SWEEP/2}deg)`;
  const c = clamp01(p);
  el.fill.setAttribute('stroke-dashoffset', ARC_LEN*(1-c));
  el.halo.setAttribute('opacity', 0.10 + 0.42*c);

  // ── Zone rouge : elle bat quand l'aiguille y entre ──
  if(c > REDLINE_AT){
    const beat = 0.55 + 0.45*Math.sin(ms/60);
    el.red.setAttribute('opacity', 0.55 + 0.45*beat);
  }

  // ── Rayons : ils s'allument avec l'allure ──
  const rayBase = Math.max(0, (c-0.12)/0.88);
  rays.forEach((r,i)=>{
    const jitter = 0.55 + 0.45*Math.sin(ms/110 + i*1.7);
    r.setAttribute('opacity', (rayBase*0.5*jitter).toFixed(3));
  });

  // ── Logo : surtension puis retour en filigrane ──
  const intro = outCubic(span(ms, 0, T.logoIn));
  const up    = outCubic(span(ms, T.logo[0], T.logoPk));
  const down  = inOutQuad(span(ms, T.logoPk, T.logo[1]));
  const surge = (1-0.62) * up * (1-down);
  el.brand.style.opacity = (0.62*intro + surge).toFixed(3);
  el.brand.style.transform = `translate(-50%,-50%) scale(${(0.86 + 0.14*up).toFixed(3)})`;

  // ── Afficheur ──
  el.readout.style.opacity = span(ms, T.run[0]-150, T.run[0]+250);
  el.speed.textContent = Math.min(TOP, Math.max(0, Math.round(p*TOP)));

  // ── Éclat au passage des 100, puis la signature ──
  const w = outCubic(span(ms, T.word[0], T.word[1]));
  el.word.style.opacity = w;
  el.word.style.letterSpacing = (26 - 19*w).toFixed(1) + 'px';
  el.word.style.textIndent = (26 - 19*w).toFixed(1) + 'px';
}

let t0=null, raf=null;
function frame(now){
  if(t0===null) t0=now;
  const e = now-t0;
  render(Math.min(e, TOTAL+HOLD));
  if(e > TOTAL+HOLD) t0=null;
  raf = requestAnimationFrame(frame);
}
function play(){ if(raf) cancelAnimationFrame(raf); t0=null; raf=requestAnimationFrame(frame); }

const frozen = new URLSearchParams(location.search).get('t');
if(frozen!==null){ render(Number(frozen)); }
else { document.addEventListener('click', play); play(); }
</script>
