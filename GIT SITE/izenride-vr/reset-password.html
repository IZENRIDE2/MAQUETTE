<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nouveau mot de passe — IzenRide</title>
<meta name="description" content="Définir un nouveau mot de passe pour son compte IzenRide.">
<meta name="theme-color" content="#08090E">
<!-- Une page de réinitialisation n'a rien à faire dans un index de moteur
     de recherche : elle ne s'atteint que par un lien nominatif. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  .reset-wrap{ min-height:72vh; display:flex; align-items:center; justify-content:center; padding:48px 20px; }
  .reset-card{
    width:100%; max-width:430px; background:var(--panel);
    border:1px solid var(--line); border-radius:24px; padding:34px;
  }
  .reset-card h1{ font-size:24px; margin:0 0 6px; }
  .reset-card .sub{ color:var(--ink-dim); font-size:14px; margin:0 0 26px; }
  .reset-card .field + .field{ margin-top:16px; }
  .reset-card .btn{ width:100%; margin-top:20px; justify-content:center; }
  .hint{ margin:7px 0 0; font-size:12px; color:var(--ink-mute); }
  .note{
    border:1px solid var(--line); border-radius:14px;
    padding:15px 16px; font-size:14px; line-height:1.6;
  }
  .note.is-bad{ border-color:rgba(226,75,74,.4); background:rgba(226,75,74,.10); }
  .note.is-ok{ border-color:rgba(93,202,165,.4); background:rgba(93,202,165,.10); }
  .note b{ display:block; margin-bottom:4px; }
  .note.is-bad b{ color:#e24b4a; }
  .note.is-ok b{ color:#5dcaa5; }
  .note p{ margin:0; color:var(--ink-dim); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<header class="nav is-stuck">
  <a class="nav__brand" href="index.html">
    <svg viewBox="0 0 40 40" class="mark" aria-hidden="true">
      <rect x="1.6" y="1.6" width="36.8" height="36.8" rx="11.5" class="mark__box"/>
      <path d="M8.5 32.5 L17.6 8.4" class="mark__edge"/>
      <path d="M31.5 32.5 L22.4 8.4" class="mark__edge"/>
      <rect x="19.1" y="10.6" width="1.8" height="3.6" rx=".9" class="mark__dash"/>
      <rect x="19.05" y="17.4" width="1.9" height="4.6" rx=".95" class="mark__dash"/>
      <rect x="19" y="25.4" width="2" height="5.8" rx="1" class="mark__dash"/>
    </svg>
    <span class="nav__word">Izen<b>Ride</b></span>
  </a>
  <nav class="nav__links" aria-label="Navigation principale">
    <a href="index.html#manifeste">Manifeste</a>
    <a href="cgu.html">CGU</a>
    <a href="cgv.html">CGV</a>
  </nav>
</header>

<main class="reset-wrap">
  <div class="reset-card">
    <h1>Nouveau mot de passe</h1>
    <p class="sub">Choisis un mot de passe pour ton compte IzenRide.</p>

    <p id="loading" class="hint">Vérification du lien…</p>

    <div id="invalid" class="note is-bad" hidden>
      <b>Lien inutilisable</b>
      <p id="invalid-reason"></p>
    </div>

    <div id="success" class="note is-ok" hidden>
      <b>Mot de passe enregistré</b>
      <p>Tu peux retourner dans l’application et t’y connecter.</p>
    </div>

    <form id="form" hidden novalidate>
      <label class="field">
        <span>Nouveau mot de passe</span>
        <input id="password" type="password" autocomplete="new-password" required>
      </label>
      <p class="hint">10 caractères minimum.</p>

      <label class="field">
        <span>Confirmation</span>
        <input id="confirm" type="password" autocomplete="new-password" required>
      </label>

      <p id="msg" class="form__msg is-bad" role="alert"></p>

      <button type="submit" id="submit" class="btn btn--primary btn--lg">Enregistrer</button>
    </form>
  </div>
</main>

<script>
(function () {
  'use strict';

  // Projet Supabase izenride-demo. La clé anon est publique par conception :
  // elle n'ouvre que ce que les politiques RLS autorisent, et tout client
  // mobile ou web de l'application l'embarque déjà. Ne jamais mettre ici la
  // clé service_role, qui elle contourne le RLS.
  var SUPABASE_URL = 'https://onzmjiykvdhhqwvebaqg.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uem1qaXlrdmRoaHF3dmViYXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjcxNzcsImV4cCI6MjA5MjY0MzE3N30.YqXmMQBjMiudy_RWWDfxD49wBb50IkXESsAXeIvPS4U';

  var MIN_LENGTH = 10;

  var loading = document.getElementById('loading');
  var invalid = document.getElementById('invalid');
  var invalidReason = document.getElementById('invalid-reason');
  var success = document.getElementById('success');
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var submit = document.getElementById('submit');

  function show(el) { el.hidden = false; }
  function hide(el) { el.hidden = true; }

  function fail(reason) {
    hide(loading);
    hide(form);
    invalidReason.textContent = reason;
    show(invalid);
  }

  // Supabase renvoie les jetons dans le FRAGMENT de l'URL (#access_token=…).
  // Un fragment n'est jamais transmis au serveur : tout se joue ici.
  var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var query = new URLSearchParams(window.location.search);

  var description = hash.get('error_description') || query.get('error_description');
  if (description) {
    fail(description + ' Demande un nouveau lien depuis l’application.');
    return;
  }

  var accessToken = hash.get('access_token');
  if (!accessToken) {
    fail("Aucun jeton dans l’adresse. Cette page s’ouvre depuis le lien reçu par e-mail ; elle ne se visite pas directement.");
    return;
  }

  // Le jeton ne doit pas rester dans la barre d’adresse : il finirait dans
  // l’historique du navigateur et dans le moindre partage d’écran.
  window.history.replaceState(null, '', window.location.pathname);

  hide(loading);
  show(form);

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    msg.textContent = '';

    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    if (password.length < MIN_LENGTH) {
      msg.textContent = 'Le mot de passe doit faire au moins ' + MIN_LENGTH + ' caractères.';
      return;
    }
    if (password !== confirm) {
      msg.textContent = 'Les deux saisies diffèrent.';
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Enregistrement…';

    fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ password: password })
    })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (payload) {
          return { ok: response.ok, status: response.status, payload: payload };
        });
      })
      .then(function (result) {
        if (!result.ok) {
          msg.textContent =
            result.payload.msg ||
            result.payload.error_description ||
            result.payload.message ||
            ('Échec (HTTP ' + result.status + ').');
          submit.disabled = false;
          submit.textContent = 'Enregistrer';
          return;
        }
        hide(form);
        show(success);
      })
      .catch(function (error) {
        msg.textContent = 'Réseau indisponible : ' + error.message;
        submit.disabled = false;
        submit.textContent = 'Enregistrer';
      });
  });
})();
</script>

</body>
</html>
