<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IZEN RIDE — Partage de position</title>
<style>
:root{--bg:#08090E;--surface:#10121A;--border:#1A1E28;--blue:#4A9CE8;--green:#5DCAA5;--amber:#FAC775;--txt:#F2F4F8;--muted:#8A91A3}
*{margin:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden}
body{position:relative;background:#0B0E15;color:var(--txt);font-family:-apple-system,'SF Pro Display','SF Pro Text',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mapbg{position:absolute;inset:0 0 46% 0}
.mapbg svg{width:100%;height:100%}
.road1{stroke:#1A2030;stroke-width:13;fill:none;stroke-linecap:round}
.road2{stroke:#161C29;stroke-width:7;fill:none;stroke-linecap:round}
.zone{position:absolute;left:50%;top:190px;transform:translateX(-50%);width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(250,199,117,.12),transparent 70%);border:1.5px dashed rgba(250,199,117,.45)}
.me{position:absolute;left:50%;top:310px;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--txt);border:4.5px solid var(--amber);box-shadow:0 0 0 9px rgba(250,199,117,.16)}
.status{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 26px 6px;font-size:14px;font-weight:600}
.status .right{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.batt{width:22px;height:11px;border:1px solid var(--muted);border-radius:3px;position:relative}
.batt::after{content:"";position:absolute;top:2px;bottom:2px;left:2px;right:5px;background:var(--green);border-radius:1px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(13,15,21,.97);border-top:1px solid var(--border);border-radius:26px 26px 0 0;padding:12px 22px 34px;backdrop-filter:blur(14px)}
.handle{width:42px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 16px}
.sheet h2{font-size:20px;font-weight:800}
.sheet>p{font-size:13px;color:var(--muted);margin-top:4px}
.dur{display:flex;gap:8px;margin-top:16px}
.dur span{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:11px 4px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.dur .on{border-color:rgba(250,199,117,.55);background:rgba(250,199,117,.1);color:var(--amber)}
.contacts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.ct{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:15px;background:var(--surface)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#08090E}
.a1{background:linear-gradient(135deg,#5DCAA5,#4A9CE8)}.a2{background:linear-gradient(135deg,#FAC775,#E24B4A)}.a3{background:linear-gradient(135deg,#7F77DD,#4A9CE8)}
.ct b{display:block;font-size:14px}
.ct small{font-size:11.5px;color:var(--muted)}
.sw{margin-left:auto;width:46px;height:27px;border-radius:99px;background:var(--green);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#08090E}
.sw.off{background:var(--border)}
.sw.off::after{right:auto;left:3px}
.go{margin-top:18px;height:54px;border-radius:16px;background:var(--blue);color:#06090F;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(74,156,232,.35)}
.e2e{margin-top:12px;text-align:center;font-size:11.5px;color:var(--muted)}
.e2e b{color:var(--green);font-weight:600}
</style>
</head>
<body>
<div class="mapbg">
  <svg viewBox="0 0 390 460" preserveAspectRatio="none" aria-hidden="true">
    <path class="road1" d="M-20 140 C 100 120, 220 190, 410 150"/>
    <path class="road1" d="M120 -20 C 100 150, 200 300, 170 480"/>
    <path class="road2" d="M-20 330 C 130 300, 260 360, 410 320"/>
  </svg>
</div>
<div class="zone"></div>
<div class="me"></div>
<div class="status"><span>22:12</span><span class="right">5G <span class="batt"></span></span></div>
<div class="sheet">
  <div class="handle"></div>
  <h2>Partager ma position</h2>
  <p>Vos proches suivent votre trajet en temps réel.</p>
  <div class="dur"><span>1 heure</span><span class="on">Jusqu'à l'arrivée</span><span>Sans limite</span></div>
  <div class="contacts">
    <div class="ct"><span class="av a1">C</span><span><b>Camille</b><small>Suit votre trajet depuis 21:30</small></span><span class="sw"></span></div>
    <div class="ct"><span class="av a2">T</span><span><b>Théo</b><small>Suit votre trajet depuis 21:30</small></span><span class="sw"></span></div>
    <div class="ct"><span class="av a3">N</span><span><b>Groupe Night Ride</b><small>24 membres</small></span><span class="sw off"></span></div>
  </div>
  <div class="go">Démarrer le partage</div>
  <div class="e2e">🔒 Position <b>chiffrée de bout en bout</b> · jamais revendue</div>
</div>
</body>
</html>
